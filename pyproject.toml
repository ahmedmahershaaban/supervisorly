[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "supervisorly"
version = "0.1.0"
description = "Evidence-based, Claude-Code-first tool for finding a PhD/master's/postdoc supervisor in any country."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahmed Maher Ali Shaaban" }]
# The deterministic layer is intentionally light on dependencies. httpx is the
# HTTP client (behind a transport seam so cassette tests need no network);
# selectolax + lxml parse HTML fast. Everything else — SQLite, robots parsing,
# hashing — is standard library.
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
supervisorly = "supervisorly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Non-Python files that are LOADED AT RUNTIME and must therefore be in the wheel, not just
# in the repo. `model/*.sql` was here; `extract/*.js` was not, and the omission was invisible
# from a source checkout — the render rung worked locally and failed in the deployed worker
# with "No such file or directory: .../supervisorly/extract/page_extract.js", because running
# from src/ reads the file straight off disk.
supervisorly = ["model/*.sql", "extract/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
